<section class="rounded-lg border border-border bg-surface p-6 shadow-sm">
  <h1 class="text-xl font-semibold">Sign in</h1>
  <p class="mt-1 text-sm text-text-secondary">Use your account email and password.</p>

  {{if .Error}}
  <div class="mt-4">{{template "components/alert.html" (dict "Type" "danger" "Message" .Error)}}</div>
  {{end}}

  <form method="post" action="/app/login" class="mt-6 space-y-4">
    {{template "components/csrf-field.html" .CSRF}}
    <div class="space-y-1">
      <label for="email" class="block text-sm font-medium">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" class="w-full rounded-md border border-border bg-surface px-3 py-2 text-sm" value="{{.Email}}">
    </div>
    <div class="space-y-1">
      <label for="password" class="block text-sm font-medium">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" class="w-full rounded-md border border-border bg-surface px-3 py-2 text-sm">
    </div>
    <button type="submit" class="inline-flex w-full items-center justify-center rounded-md bg-primary px-3 py-2 text-sm font-medium text-primary-fg hover:opacity-90">Sign in</button>
  </form>
</section>
