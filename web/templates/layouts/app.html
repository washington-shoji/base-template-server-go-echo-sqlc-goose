<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}App</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme-boot.js"></script>
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="min-h-full flex flex-col bg-surface text-text">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:bg-primary focus:px-3 focus:py-2 focus:text-primary-fg">Skip to content</a>
  <header class="border-b border-border bg-surface">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-4 px-4 py-3">
      <nav class="flex flex-wrap items-center gap-4 text-sm font-medium" aria-label="Primary">
        <a href="/app/todos" class="{{if eq .Nav "todos"}}text-primary{{else}}text-text-secondary hover:text-text{{end}} no-underline">Todos</a>
        <a href="/app/reports" class="{{if eq .Nav "reports"}}text-primary{{else}}text-text-secondary hover:text-text{{end}} no-underline">Reports</a>
      </nav>
      <div class="flex items-center gap-3 text-sm text-text-secondary">
        {{if .User}}<span class="hidden sm:inline">{{.User}}</span>{{end}}
        <button type="button" data-theme-toggle class="rounded-md border border-border px-2 py-1 text-xs hover:bg-surface-muted" aria-label="Toggle color theme">Theme</button>
        <a href="/app/login" class="no-underline text-text-secondary hover:text-text">Login</a>
      </div>
    </div>
  </header>
  <main id="main" class="mx-auto w-full max-w-3xl flex-1 px-4 py-8">
    {{template "components/flash.html" .Flash}}
    {{.Content}}
  </main>
</body>
</html>
